<!-- ═══ TAB 1: Generate Image ═══ -->
    <div class="tab-panel active" id="tab-generate">
      <div class="split">
        <div class="output-pane" id="genOutputPane">
          <button class="output-overlay-btn top-right" onclick="openGenerateLightbox()" title="Fullscreen (gallery)" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <div class="output-placeholder" id="genPlaceholder">
            <div class="icon">🖼️</div>
            <p>Your generated image<br>will appear here</p>
            <p style="font-size:.75rem;margin-top:6px;">Click to open lightbox</p>
          </div>
          <div class="gen-spinner" id="genSpinner"><div class="ring"></div></div>
        </div>
        <div class="params-pane">
          <!-- The Generate parameter controls now live in the prompt chips
               (📏 dimensions / 👣 steps+seed — see #genParams below):
               renderPromptChips moves them into the chip popover, so the
               prompt textarea takes over this whole pane. -->
        </div>
      </div>
    </div>
    <!-- Generate parameter controls (moved to the prompt-chip popover by
         renderPromptChips on load — the IDs are unchanged, so storage.js and
         generate.js keep working without modifications). -->
    <div id="genParams" data-params-block hidden>
      <div id="genParamsDims" data-chip-section="dims">
        <!-- Row 1: W | H (read-only) -->
        <div class="field-row">
          <div class="field-inline" style="flex:1"><label title="Width (read-only)">↔️</label><span class="readonly-field" id="genWidth">832</span></div>
          <div class="field-inline" style="flex:1"><label title="Height (read-only)">↕️</label><span class="readonly-field" id="genHeight">1248</span></div>
        </div>
        <!-- Row 2: AR | MP -->
        <div class="field-row">
          <div class="field-inline" style="flex:1.2">
            <label title="Aspect Ratio">📐</label>
            <select id="genAspectRatio" onchange="onModelFamilyChange()">
              <option data-w="2" data-h="3">2:3</option>
              <option data-w="1" data-h="1">1:1</option>
              <option data-w="3" data-h="2">3:2</option>
              <option data-w="3" data-h="4">3:4</option>
              <option data-w="4" data-h="3">4:3</option>
              <option data-w="9" data-h="16">9:16</option>
              <option data-w="16" data-h="9">16:9</option>
            </select>
          </div>
          <div class="field-inline" style="flex:1.4">
            <label title="Megapixels (0.1–2.0)">🔲</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepMp(-0.1)" title="Decrease">−</button>
              <input type="number" id="genMegapixel" value="1" min="0.1" max="2" step="0.1" oninput="onModelFamilyChange()">
              <button class="stepper-btn" onclick="stepMp(0.1)" title="Increase">+</button>
            </div>
          </div>
        </div>
        <!-- Custom ratio (dead code in the mockup — kept for parity) -->
        <div class="field-row" id="genCustomRatio" style="display:none">
          <div class="field">
            <label>Custom W</label>
            <input type="number" value="16" min="1" class="gen-dim" oninput="recalcResolution()">
          </div>
          <div class="field">
            <label>Custom H</label>
            <input type="number" value="9" min="1" class="gen-dim" oninput="recalcResolution()">
          </div>
        </div>
      </div>
      <div id="genParamsStepSeed" data-chip-section="stepseed">
        <!-- Row: Steps -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Steps">👣</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepSteps(-1)" title="Decrease">−</button>
              <input type="number" id="genSteps" value="10" min="1" max="15" step="1" oninput="onStepsInput()">
              <button class="stepper-btn" onclick="stepSteps(1)" title="Increase">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Seed + Random -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Seed">🌱</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepGenSeed(-1)" title="Decrease">−</button>
              <input type="number" id="genSeed" value="0" min="0" step="1" disabled oninput="onGenSeedInput()">
              <button class="stepper-btn" onclick="stepGenSeed(1)" title="Increase">+</button>
            </div>
            <label class="check-label" style="margin-left:4px">
              <input type="checkbox" id="genSeedRandom" checked onchange="onSeedRandomToggle()">
              🎲
            </label>
          </div>
        </div>
      </div>
    </div>
