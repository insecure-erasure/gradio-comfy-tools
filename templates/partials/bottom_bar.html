<!-- Bottom prompt bar.
     Landscape (≥1024px): JS relocates #promptBlock and #resultUrlRow (URL +
     copy button) into the active tab's params pane — URL hint below the
     prompt — and hides this bar entirely to gain vertical space.
     Portrait (<1024px): everything stays here, as before. -->
<div class="bottom-bar" id="bottomBar">
  <div class="prompt-block" id="promptBlock">
    <div class="prompt-input-wrap">
      <textarea id="promptInput"
        placeholder="Describe the image you want to generate in detail..."></textarea>
      <button class="prompt-clear" id="btnPromptClear" onclick="clearPrompt()" title="Clear prompt">✕</button>
      <button class="prompt-refine-btn" id="btnPromptRefine" onclick="refinePrompt()" title="Refine prompt" aria-label="Refine prompt">🪄</button>
    </div>
    <div class="btn-col" id="btnCol">
      <button class="btn-generate" id="btnGenerate" onclick="generateImage()" title="Generate">✨</button>
    </div>
  </div>
  <div class="result-url-row" id="resultUrlRow">
    <span class="result-url" id="resultUrl"></span>
    <button class="btn-copy-inline" id="btnCopyUrl" onclick="copyResultUrl()" title="Copy URL" disabled>📋</button>
  </div>
</div>
