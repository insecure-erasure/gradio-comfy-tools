<!-- Bottom prompt bar.
     Landscape (≥1024px): JS relocates #promptBlock and #resultUrlRow (URL +
     copy button) into the active tab's params pane — URL hint below the
     prompt — and hides this bar entirely to gain vertical space.
     Portrait (<1024px): everything stays here, as before. -->
<div class="bottom-bar" id="bottomBar">
  <div class="prompt-block" id="promptBlock">
    <div class="prompt-input-wrap">
      <!-- One INDEPENDENT textarea per tab (generate / edit / video). Each
           keeps its own value permanently — the tabs never share a field,
           so prompts can never mix. switchTab only toggles which one is
           visible (.prompt-input.active). Upscale has no prompt. -->
      <textarea id="promptInputGenerate" class="prompt-input" data-tab="generate"
        placeholder="Describe the image you want to generate in detail..."
        onclick="openPromptModal()"></textarea>
      <textarea id="promptInputEdit" class="prompt-input" data-tab="edit"
        placeholder="Describe the edit you want to apply (e.g., &quot;change the background to a beach at sunset&quot;)..."
        onclick="openPromptModal()"></textarea>
      <textarea id="promptInputVideo" class="prompt-input" data-tab="video"
        placeholder="Describe the motion and action (e.g., &quot;a cat walking slowly through a field of flowers, gentle breeze&quot;)..."
        onclick="openPromptModal()"></textarea>
      <!-- Face swap: the prompt is NOT used yet — the field is readonly (a
           placeholder for a future version; the flow's prompt is fixed
           inside the workflow). Readonly (not disabled) so tapping it can
           still open the portrait prompt modal, where the 👣 parameter
           chips live — same interaction as Edit. -->
      <textarea id="promptInputFaceSwap" class="prompt-input" data-tab="face_swap" readonly
        placeholder="Prompt (coming soon) — the face swap runs with its built-in prompt"
        onclick="openPromptModal()"></textarea>
      <button class="prompt-clear" id="btnPromptClear" onclick="clearPrompt()" title="Clear prompt">✕</button>
      <!-- Overlay actions, bottom-right (portrait prompt modal only): 🪄
           refine + 🩹 restore (Edit only) + ✨ direct generation — larger
           than the chips. In the compact bar and in landscape they are
           hidden (CSS); the button column (.btn-col) holds the same actions
           there. -->
      <div class="prompt-actions" id="promptActions">
        <button class="prompt-refine-btn" id="btnPromptRefine" onclick="refinePrompt()" title="Refine prompt" aria-label="Refine prompt">🪄</button>
        <button class="btn-generate prompt-restore-btn" id="promptRestoreBtn" onclick="promptModalRestore()" title="Restore">🩹</button>
        <button class="btn-generate prompt-generate-btn" id="promptGenerateBtn" onclick="promptModalGenerate()" title="Generate">✨</button>
      </div>
      <!-- Per-tab parameter chips overlaid on the prompt field (renderPromptChips
           in tabs.js fills this): Generate shows 📏 dimensions + 👣 steps/seed.
           Clicking a chip opens the small popover with the actual controls. -->
      <div class="prompt-chips" id="promptChips"></div>
      <!-- Action buttons (✨/🖌️/🩹/🎬 + 🪄 refine) — now ALSO chips inside
           the prompt field (bottom-right), consistent with the prompt modal.
           switchTab rebuilds this innerHTML per tab; the generation lock /
           stop-by-transformation / click-catchers keep working as before. -->
      <div class="btn-col" id="btnCol">
        <button class="btn-generate" id="btnGenerate" onclick="generateImage()" title="Generate">✨</button>
      </div>
    </div>
  </div>
  <div class="result-url-row" id="resultUrlRow">
    <!-- Progress + timing row. While a job runs: node progress (#resultUrl)
         + ⏱ elapsed (#resultTime). Once the result lands: the generation
         URL (click it to copy — no button needed) + ⏱ duration.
         The fullscreen gallery's 📋 button also copies the URL. -->
    <span class="result-url" id="resultUrl" title="" onclick="copyResultHint()"></span>
    <span class="result-time" id="resultTime"></span>
    <!-- Copy confirmation box: floats over the row after clicking the URL,
         showing the copied URL. -->
    <div class="result-copy-box" id="resultCopyBox">
      <div class="result-copy-box-label">📋 URL copied</div>
      <div class="result-copy-box-url" id="resultCopyBoxUrl"></div>
    </div>
  </div>
  <!-- Prompt fullscreen modal (portrait only): the compact single-line
       prompt opens a fullscreen field when tapped. openPromptModal()
       relocates the .prompt-input-wrap (textarea + ✕ + 🪄) into the box
       and adds .modal-mode (overlay buttons back to their original
       layout: ✕ top-right, 🪄 bottom-right); closePromptModal() moves it
       back to #promptBlock. The action buttons (.btn-col) stay in the
       bar. -->
  <div class="prompt-modal" id="promptModal">
    <div class="prompt-modal-header">
      <span class="prompt-modal-title">Prompt</span>
      <button class="prompt-modal-done" onclick="closePromptModal()" title="Done">✓ Done</button>
    </div>
    <div class="prompt-modal-box" id="promptModalBox"></div>
  </div>
</div>
