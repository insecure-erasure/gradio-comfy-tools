<!-- Brightness / contrast / saturation panel. One LayerColor node applies
     all three in a single ComfyUI pass; this panel only collects the
     factors and previews them with CSS filters. All controls live in the
     bottom strip so the preview gets the full top area. -->
<div class="adjust-overlay" id="adjustOverlay" role="dialog" aria-modal="true"
     aria-label="Adjust image" aria-hidden="true">
  <div class="adjust-preview-wrap" id="adjustPreviewWrap">
    <img id="adjustImage" alt="Adjustment preview" draggable="false">
  </div>
  <div class="adjust-controls">
    <div class="adjust-sliders">
      <div class="adjust-row">
        <label for="adjustBrightness">Brightness</label>
        <input type="range" id="adjustBrightness" min="-100" max="100" step="1" value="0">
        <output id="adjustBrightnessValue" for="adjustBrightness">0%</output>
      </div>
      <div class="adjust-row">
        <label for="adjustContrast">Contrast</label>
        <input type="range" id="adjustContrast" min="-100" max="100" step="1" value="0">
        <output id="adjustContrastValue" for="adjustContrast">0%</output>
      </div>
      <div class="adjust-row">
        <label for="adjustSaturation">Saturation</label>
        <input type="range" id="adjustSaturation" min="-100" max="100" step="1" value="0">
        <output id="adjustSaturationValue" for="adjustSaturation">0%</output>
      </div>
    </div>
    <div class="adjust-actions">
      <button type="button" class="adjust-btn" id="adjustReset">Reset</button>
      <button type="button" class="adjust-btn" id="adjustCancel" title="Cancel (Esc)">Cancel</button>
      <button type="button" class="adjust-btn primary" id="adjustApply" disabled title="Apply adjustments (Enter)">Apply</button>
    </div>
  </div>
</div>
