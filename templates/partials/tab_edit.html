<!-- ═══ TAB 2: Edit Image ═══ -->
    <div class="tab-panel" id="tab-edit">
      <div class="split">
        <div class="output-pane" id="editOutputPane">
          <button class="output-overlay-btn top-right" onclick="openCompareFullscreen('edit')" title="Fullscreen (compare)" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <button class="output-overlay-btn bottom-right-left" onclick="uploadForTab('edit')" title="Upload image">📁</button>
          <div class="source-url-field">
            <input type="text" class="source-url-input" id="editSourceUrl" placeholder="Paste image URL…" oninput="clearSourcePreview('edit')" />
            <button class="source-url-confirm" onclick="confirmSourceUrl('edit')" title="Load this image">✓</button>
          </div>
          <button class="output-overlay-btn bottom-right" onclick="usePreviousSource('edit')" title="Use previous generation">🔗</button>
          <div class="compare-slider" id="editCompare" style="display:none">
            <img class="side before" id="editBefore" src="" draggable="false" alt="Original">
            <img class="side after" id="editAfter" src="" draggable="false" alt="Edited">
            <span class="label" id="editCompareBeforeLabel">Original</span>
            <span class="label" id="editCompareAfterLabel" style="right:12px;left:auto">Edited</span>
            <div class="divider"></div>
            <div class="handle"><span></span><span></span></div>
          </div>
          <div class="gen-spinner" id="editSpinner"><div class="ring"></div></div>
        </div>
        <div class="params-pane">
          <!-- Edit parameters live in the 👣 prompt chip (see #editParams
               below): renderPromptChips moves them into the chip popover,
               so the prompt fills this pane. -->
        </div>
      </div>
    </div>
    <!-- Edit parameter controls (moved to the 👣 chip popover by
         renderPromptChips — the IDs are unchanged, so storage.js and
         edit.js keep working without modifications). -->
    <div id="editParams" data-params-block hidden>
      <div id="editParamsStepSeed" data-chip-section="stepseed">
        <!-- Row: Steps -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Steps">👣</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepEditSteps(-1)" title="Decrease">−</button>
              <input type="number" id="editSteps" value="6" min="1" max="15" step="1" oninput="onEditStepsInput()">
              <button class="stepper-btn" onclick="stepEditSteps(1)" title="Increase">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Seed + Random -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Seed">🌱</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepEditSeed(-1)" title="Decrease">−</button>
              <input type="number" id="editSeed" value="0" min="0" step="1" disabled oninput="onEditSeedInput()">
              <button class="stepper-btn" onclick="stepEditSeed(1)" title="Increase">+</button>
            </div>
            <label class="check-label" style="margin-left:4px">
              <input type="checkbox" id="editSeedRandom" checked onchange="onEditSeedRandomToggle()">
              🎲
            </label>
          </div>
        </div>
      </div>
    </div>
