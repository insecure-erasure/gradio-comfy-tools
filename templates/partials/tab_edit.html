<!-- ═══ TAB 2: Edit Image ═══ -->
    <div class="tab-panel" id="tab-edit">
      <div class="split">
        <div class="output-pane" id="editOutputPane">
          <button class="output-overlay-btn top-right" onclick="openCompareFullscreen('edit')" title="Fullscreen (compare)" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <button class="output-overlay-btn pane-nav prev" onclick="paneNav('edit',-1)" title="Previous" aria-label="Previous" style="display:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="output-overlay-btn pane-nav next" onclick="paneNav('edit',1)" title="Next" aria-label="Next" style="display:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="output-overlay-btn bottom-right-left" onclick="uploadForTab('edit')" title="Upload image">📁</button>
          <div class="source-url-field">
            <input type="text" class="source-url-input" id="editSourceUrl" placeholder="Paste image URL…" oninput="clearSourcePreview('edit')" />
            <button class="source-url-confirm" onclick="confirmSourceUrl('edit')" title="Load this image">✓</button>
          </div>
          <button class="output-overlay-btn bottom-right" onclick="usePreviousSource('edit')" title="Use previous generation">🔗</button>
          <button class="output-overlay-btn bottom-right-left2 source-history-btn" id="editHistoryBtn" onclick="openSourceHistory('edit', this)" title="Recent source images">🕘</button>
          <!-- Live Extend preview (⛶ chip popover): the dashed frame is the
               canvas the workflow will produce; the translucent guide marks
               the source image at its REAL padding offset inside it. -->
          <div class="extend-preview-overlay" id="editExtendPreview" aria-hidden="true" style="display:none">
            <div class="extend-preview-frame">
              <div class="extend-preview-source" id="editExtendPreviewSource"></div>
            </div>
          </div>
          <div class="compare-slider" id="editCompare" style="display:none">
            <img class="side before" id="editBefore" src="" draggable="false" alt="Original">
            <img class="side after" id="editAfter" src="" draggable="false" alt="Edited">
            <span class="label" id="editCompareBeforeLabel">Original</span>
            <span class="label" id="editCompareAfterLabel" style="right:12px;left:auto">Edited</span>
            <div class="divider"></div>
            <div class="handle"><span></span><span></span></div>
          </div>
          <div class="extend-toggle" id="editExtendToggle" role="group" aria-label="Compare original and extended" style="display:none">
            <button type="button" class="extend-toggle-btn" id="editExtendOriginalBtn" onclick="setEditExtendView(true)" aria-pressed="false">Original</button>
            <button type="button" class="extend-toggle-btn active" id="editExtendResultBtn" onclick="setEditExtendView(false)" aria-pressed="true">Extended</button>
          </div>
          <div class="gen-spinner" id="editSpinner"><div class="ring"></div></div>
        </div>
        <div class="params-pane">
          <!-- Edit parameters live in the 👣 prompt chip (see #editParams
               below): renderPromptChips moves them into the chip popover,
               so the prompt fills this pane. -->
        </div>
      </div>
    </div>
    <!-- Edit parameter controls (moved to the 👣 chip popover by
         renderPromptChips — the IDs are unchanged, so storage.js and
         edit.js keep working without modifications). -->
    <div id="editParams" data-params-block hidden>
      <div id="editParamsStepSeed" data-chip-section="stepseed">
        <!-- Row: Steps -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Steps">👣</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepEditSteps(-1)" title="Decrease">−</button>
              <input type="number" id="editSteps" value="6" min="1" max="15" step="1" oninput="onEditStepsInput()">
              <button class="stepper-btn" onclick="stepEditSteps(1)" title="Increase">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Seed + Random -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Seed">🌱</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onclick="stepEditSeed(-1)" title="Decrease" aria-label="Decrease seed">−</button>
              <input type="text" class="seed-input" id="editSeed" value="0"
                     inputmode="numeric" pattern="[0-9]*"
                     autocomplete="off" spellcheck="false"
                     role="spinbutton" aria-label="Seed"
                     aria-valuemin="0" aria-valuemax="18446744073709551615" aria-valuenow="0"
                     disabled oninput="onEditSeedInput()">
              <button type="button" class="stepper-btn" onclick="stepEditSeed(1)" title="Increase" aria-label="Increase seed">+</button>
            </div>
            <label class="check-label" style="margin-left:4px">
              <input type="checkbox" id="editSeedRandom" checked onchange="onEditSeedRandomToggle()">
              🎲
            </label>
          </div>
        </div>
      </div>
      <div id="editParamsExtend" data-chip-section="extend">
        <div class="extend-info" aria-live="polite">
          <div class="extend-info-row"><span class="extend-info-label">Source</span><span class="extend-info-value" id="editExtendSourceDims">—</span></div>
          <div class="extend-info-row"><span class="extend-info-label">Output ≈</span><span class="extend-info-value" id="editExtendOutputDims">—</span></div>
        </div>
        <div class="extend-hint">Padding in px · 1.5 MP working canvas</div>
        <!-- Row: Top / Bottom -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Top padding">⬆️</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('top', -1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Decrease top padding (hold to accelerate)">−</button>
              <input type="number" id="editPadTop" value="0" min="0" max="1024" step="1" inputmode="numeric" aria-label="Top padding" oninput="onEditPadInput('top')">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('top', 1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Increase top padding (hold to accelerate)">+</button>
            </div>
          </div>
          <div class="field-inline" style="flex:1">
            <label title="Bottom padding">⬇️</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('bottom', -1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Decrease bottom padding (hold to accelerate)">−</button>
              <input type="number" id="editPadBottom" value="0" min="0" max="1024" step="1" inputmode="numeric" aria-label="Bottom padding" oninput="onEditPadInput('bottom')">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('bottom', 1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Increase bottom padding (hold to accelerate)">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Left / Right -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Left padding">⬅️</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('left', -1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Decrease left padding (hold to accelerate)">−</button>
              <input type="number" id="editPadLeft" value="0" min="0" max="1024" step="1" inputmode="numeric" aria-label="Left padding" oninput="onEditPadInput('left')">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('left', 1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Increase left padding (hold to accelerate)">+</button>
            </div>
          </div>
          <div class="field-inline" style="flex:1">
            <label title="Right padding">➡️</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('right', -1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Decrease right padding (hold to accelerate)">−</button>
              <input type="number" id="editPadRight" value="0" min="0" max="1024" step="1" inputmode="numeric" aria-label="Right padding" oninput="onEditPadInput('right')">
              <button type="button" class="stepper-btn" onpointerdown="startEditPadStep('right', 1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Increase right padding (hold to accelerate)">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Feathering -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Feathering">🪶</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" onpointerdown="startEditFeatherStep(-1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Decrease feathering (hold to accelerate)">−</button>
              <input type="number" id="editFeather" value="40" min="0" max="256" step="1" inputmode="numeric" aria-label="Feathering" oninput="onEditFeatherInput()">
              <button type="button" class="stepper-btn" onpointerdown="startEditFeatherStep(1, event)" onpointerup="stopEditPadStep()" onpointerleave="stopEditPadStep()" onpointercancel="stopEditPadStep()" title="Increase feathering (hold to accelerate)">+</button>
            </div>
          </div>
        </div>
      </div>
    </div>
