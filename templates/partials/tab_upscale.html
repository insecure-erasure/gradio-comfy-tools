<!-- ═══ TAB 3: Upscale ═══ -->
    <div class="tab-panel" id="tab-upscale">
      <div class="split">
        <div class="output-pane" id="upscaleOutputPane">
          <button class="output-overlay-btn top-right" onclick="openCompareFullscreen('upscale')" title="Fullscreen (compare)" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <button class="output-overlay-btn bottom-right-left" onclick="uploadForTab('upscale')" title="Upload image">📁</button>
          <div class="source-url-field">
            <input type="text" class="source-url-input" id="upscaleSourceUrl" placeholder="Paste image URL…" oninput="clearSourcePreview('upscale')" />
            <button class="source-url-confirm" onclick="confirmSourceUrl('upscale')" title="Load this image">✓</button>
          </div>
          <button class="output-overlay-btn bottom-right" onclick="usePreviousSource('upscale')" title="Use previous generation">🔗</button>
          <div class="compare-slider" id="upscaleCompare" style="display:none">
            <img class="side before" id="upscaleBefore" src="" draggable="false" alt="Original">
            <img class="side after" id="upscaleAfter" src="" draggable="false" alt="Upscaled">
            <span class="label">Original</span>
            <span class="label" style="right:12px;left:auto">Upscaled</span>
            <div class="divider"></div>
            <div class="handle"><span></span><span></span></div>
          </div>
          <div class="gen-spinner" id="upscaleSpinner"><div class="ring"></div></div>
        </div>
        <div class="params-pane">
          <!-- Upscale has no prompt — its 🌱 seed chip lives HERE (in the
               params pane, see #upscaleChips), and the controls move to the
               chip popover by renderPromptChips (see #upscaleParams below). -->
          <div class="upscale-chips" id="upscaleChips"></div>
        </div>
      </div>
    </div>
    <!-- Upscale parameter controls (moved to the 🌱 chip popover by
         renderPromptChips — the IDs are unchanged, so storage.js and
         upscale.js keep working without modifications). -->
    <div id="upscaleParams" data-params-block hidden>
      <div id="upscaleParamsSeed" data-chip-section="seed">
        <!-- Row: Seed + Random -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Seed">🌱</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepUpscaleSeed(-1)" title="Decrease">−</button>
              <input type="number" id="upscaleSeed" value="0" min="0" step="1" disabled oninput="onUpscaleSeedInput()">
              <button class="stepper-btn" onclick="stepUpscaleSeed(1)" title="Increase">+</button>
            </div>
            <label class="check-label" style="margin-left:4px">
              <input type="checkbox" id="upscaleSeedRandom" checked onchange="onUpscaleSeedRandomToggle()">
              🎲
            </label>
          </div>
        </div>
      </div>
    </div>
