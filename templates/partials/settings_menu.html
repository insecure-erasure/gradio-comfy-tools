<!-- Settings dropdown menu -->
  <div class="settings-dropdown" id="settingsMenu">
    <div class="menu-section">Appearance</div>
    <button class="menu-item" onclick="toggleTheme(); hideSettingsMenu();">
      <span class="item-icon">🌓</span> Toggle light / dark theme
    </button>
    <div class="menu-sep"></div>
    <div class="menu-section">ComfyUI Connection</div>
    <button class="menu-item" onclick="configureServerUrl(); hideSettingsMenu();">
      <span class="item-icon">🔌</span> Server URL
      <span id="serverUrlValue" style="margin-left:auto;font-size:.7rem;color:var(--text-secondary)">…</span>
    </button>
    <button class="menu-item" onclick="configureMediaBaseUrl(); hideSettingsMenu();">
      <span class="item-icon">🖼️</span> Media base URL
      <span id="mediaBaseUrlValue" style="margin-left:auto;font-size:.7rem;color:var(--text-secondary)">…</span>
    </button>
    <div class="menu-sep"></div>
    <div class="menu-section">Prompt Refiner</div>
    <button class="menu-item" onclick="configureRefinerUrl(); hideSettingsMenu();">
      <span class="item-icon">🪄</span> Refiner URL
      <span id="refinerUrlValue" style="margin-left:auto;font-size:.7rem;color:var(--text-secondary)">…</span>
    </button>
    <div class="menu-item menu-item-col">
      <span class="item-icon">💬</span> System prompt
    </div>
    <textarea class="menu-textarea" id="refinerSystemPromptInput" rows="3"
      placeholder="Instructions for refining prompts…"
      onchange="onRefinerSystemPromptChange()"></textarea>
    <div class="menu-sep"></div>
    <!-- Global reset — bottom of the menu. Deletes ALL user data stored in
         the browser (settings, prompts, history, galleries) and reloads.
         The confirmation message is user-facing, no internal jargon. -->
    <button class="menu-item menu-item-danger" onclick="resetAllUserData(); hideSettingsMenu();">
      <span class="item-icon">🗑️</span> Reset everything
    </button>
    <div class="menu-sep"></div>
    <!-- App version (the asset hash in the script/CSS URLs). If this line
         is missing, the page is a stale load — hard-reload (Ctrl+Shift+R). -->
    <div class="menu-item menu-item-col" style="pointer-events:none;opacity:.55;font-size:.68rem">
      App version <span id="appVersionLabel">{{ asset_version }}</span>
    </div>
  </div>
