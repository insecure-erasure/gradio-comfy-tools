<!-- ═══ TAB 4: Generate Video ═══ -->
    <div class="tab-panel" id="tab-video">
      <div class="split">
        <div class="output-pane" id="videoOutputPane">
          <button class="output-overlay-btn top-right" onclick="openVideoGallery()" title="Fullscreen (gallery)" aria-label="Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
          <button class="output-overlay-btn bottom-right-left" onclick="uploadForTab('video')" title="Upload image">📁</button>
          <div class="source-url-field">
            <input type="text" class="source-url-input" id="videoSourceUrl" placeholder="Paste image URL…" oninput="clearSourcePreview('video')" />
            <button class="source-url-confirm" onclick="confirmSourceUrl('video')" title="Load this image">✓</button>
          </div>
          <button class="output-overlay-btn bottom-right" onclick="usePreviousSource('video')" title="Use previous generation">🔗</button>
          <div class="video-mock" onclick="showToast('Video player (WIP)')">
            <div class="play-btn">▶</div>
            <div class="bar"><div class="progress"></div></div>
          </div>
          <div class="gen-spinner" id="videoSpinner"><div class="ring"></div></div>
        </div>
        <div class="params-pane">
          <!-- Video parameters live in the 🎞️/👣 prompt chips (see
               #videoParams below): renderPromptChips moves them into the
               chip popover, so the prompt fills this pane. -->
        </div>
      </div>
    </div>
    <!-- Video parameter controls (moved to the 🎞️/👣 chip popover by
         renderPromptChips — the IDs are unchanged, so storage.js and
         video.js keep working without modifications). -->
    <div id="videoParams" data-params-block hidden>
      <div id="videoParamsFrames" data-chip-section="frames">
        <!-- Row: Frames -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Frames (4n+1, 81–161)">🎞️</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepVideoFrames(-4)" title="Decrease">−</button>
              <input type="number" id="videoFrames" value="81" min="81" max="161" step="4" oninput="onVideoFramesInput()">
              <button class="stepper-btn" onclick="stepVideoFrames(4)" title="Increase">+</button>
            </div>
          </div>
        </div>
      </div>
      <div id="videoParamsStepSeed" data-chip-section="stepseed">
        <!-- Row: Steps -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Steps (4–10)">👣</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepVideoSteps(-1)" title="Decrease">−</button>
              <input type="number" id="videoSteps" value="4" min="4" max="10" step="1" oninput="onVideoStepsInput()">
              <button class="stepper-btn" onclick="stepVideoSteps(1)" title="Increase">+</button>
            </div>
          </div>
        </div>
        <!-- Row: Seed + Random -->
        <div class="field-row">
          <div class="field-inline" style="flex:1">
            <label title="Seed">🌱</label>
            <div class="stepper">
              <button class="stepper-btn" onclick="stepVideoSeed(-1)" title="Decrease">−</button>
              <input type="number" id="videoSeed" value="0" min="0" step="1" disabled oninput="onVideoSeedInput()">
              <button class="stepper-btn" onclick="stepVideoSeed(1)" title="Increase">+</button>
            </div>
            <label class="check-label" style="margin-left:4px">
              <input type="checkbox" id="videoSeedRandom" checked onchange="onVideoSeedRandomToggle()">
              🎲
            </label>
          </div>
        </div>
      </div>
    </div>
