<!-- Fullscreen gallery overlay (B5) — ported from the reference image
     viewers (../open-webui-comfy-tools smart_generate_image / edit_image /
     upscale_image). Two modes, one overlay:
       • lightbox (Generate): a centered big image + gallery navigation
         (‹ ›, n/N counter, Show prompt button, download). Close ✕ is top-RIGHT,
         download is top-LEFT (inverted vs the reference — project decision).
         The prompt is NOT shown as a bottom caption anymore: a Show prompt
         button (visible only when the entry has a prompt) reveals it on
         hover — no click needed — as a semi-transparent BOTTOM panel with
         a modest, device-appropriate font size (see .gallery-prompt-* in
         components.css).
       • compare (Edit/Upscale): the interactive before/after slider fills
         the screen; the gallery there only navigates the edited/upscaled
         comparisons, and edited entries show the edit prompt as caption.
     The overlay element itself is fullscreened (not documentElement) so the
     page state is untouched; Escape / backdrop / ✕ close it.
     Opened/closed by static/js/gallery.js. -->
<div class="gallery-overlay" id="galleryOverlay">
  <img class="gallery-big" id="galleryBig" alt="" draggable="false">
  <div class="gallery-video-wrap" id="galleryVideoWrap" style="display:none"></div>
  <div class="compare-slider gallery-slider" id="gallerySlider">
    <img class="side before" id="galleryBefore" src="" draggable="false" alt="Original">
    <img class="side after" id="galleryAfter" src="" draggable="false" alt="Result">
    <span class="label" id="galleryLabelBefore">Original</span>
    <span class="label" id="galleryLabelAfter" style="right:12px;left:auto">Result</span>
    <div class="divider"></div>
    <div class="handle"><span></span><span></span></div>
  </div>
  <button class="gallery-prompt-btn" id="galleryPromptBtn" title="Show prompt">Show prompt</button>
  <div class="gallery-prompt-modal" id="galleryPromptModal">
    <div class="gallery-prompt-box" id="galleryPromptBox">
      <div class="gallery-prompt-text" id="galleryPromptText"></div>
    </div>
  </div>
  <div class="gallery-badge" id="galleryBadge"></div>
  <!-- Prompt box shown when the badge is CLICKED: the badge hides and this
       box appears with ONLY the ORIGINAL generation prompt (the prompt of
       the image the edit/restore/upscale was made from). Hidden by default;
       only appears on badge click. -->
  <div class="gallery-badge-box" id="galleryBadgeBox">
    <div class="gallery-prompt-box">
      <div class="gallery-prompt-text" id="galleryBadgeBoxText"></div>
    </div>
  </div>
  <button class="gallery-btn gallery-close" id="galleryClose" title="Close" aria-label="Close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button class="gallery-btn gallery-dl" id="galleryDl" title="Download" aria-label="Download">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
  </button>
  <button class="gallery-btn gallery-copy" id="galleryCopy" title="Copy URL" aria-label="Copy URL">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
  </button>
  <button class="gallery-btn gallery-trash" id="galleryTrash" title="Delete this entry" aria-label="Delete this entry">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
  </button>
  <button class="gallery-btn gallery-prev" id="galleryPrev" title="Previous" aria-label="Previous">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="gallery-btn gallery-next" id="galleryNext" title="Next" aria-label="Next">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="gallery-counter" id="galleryCounter"></div>
</div>
