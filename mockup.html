<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradio Comfy Tools — Mockup</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface-hover: #1c2a4a;
    --accent: #e94560;
    --accent-hover: #ff6b81;
    --text: #eaeaea;
    --text-secondary: #a0a0b0;
    --border: #2a2a4a;
    --radius: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,.4);
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --tab-height: 44px;
    --bottom-height: 120px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Tabs (combined bar: gear + tabs + title dropdown) ── */
  .tabs {
    display: flex;
    gap: 0;
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    min-height: var(--tab-height);
  }

  /* Output zone: same width as output pane (60%), gear at right edge */
  .tabs-output-zone {
    flex: 6;
    display: flex;
    align-items: center;
    min-width: 0;
  }
  .tabs-inner {
    display: flex;
    align-items: center;
    padding-left: 20px;
    padding-right: 8px;
    flex: 1;
    min-width: 0;
  }
  .tab-gear {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px; height: 32px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    font-size: 1.05rem;
    cursor: pointer;
    transition: .15s;
    flex-shrink: 0;
    margin-left: auto;
  }
  .tab-gear:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--accent);
  }

  /* Params zone: matches .params-pane exactly */
  .tabs-params-zone {
    flex: 4;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
    border-left: 1px solid var(--border);
    min-width: 280px;
    max-width: 420px;
  }

  .tab-btn {
    padding: 12px 16px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: .82rem;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: .15s;
    white-space: nowrap;
    font-family: var(--font);
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-icon { margin-right: 5px; font-size: .85rem; }

  .tabs-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius);
    color: var(--text);
    padding: 5px 10px;
    font-size: .84rem;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
    font-family: var(--font);
    white-space: nowrap;
  }
  .tabs-title:hover {
    background: var(--surface-hover);
    border-color: var(--border);
  }
  .tabs-arrow {
    font-size: .7rem;
    color: var(--text-secondary);
    transition: transform .2s;
  }
  .tabs-title.open .tabs-arrow { transform: rotate(180deg); }

  /* Dropdown menu */
  .settings-dropdown {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
    z-index: 150;
    min-width: 220px;
    padding: 6px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-4px);
    transition: .15s;
  }
  .settings-dropdown.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }
  .settings-dropdown .menu-section {
    padding: 6px 8px 2px;
    font-size: .62rem;
    font-weight: 700;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .settings-dropdown .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: .82rem;
    color: var(--text);
    cursor: pointer;
    transition: .1s;
    border: none;
    background: transparent;
    font-family: var(--font);
    width: 100%;
    text-align: left;
  }
  .settings-dropdown .menu-item:hover { background: var(--surface-hover); }
  .settings-dropdown .menu-item .item-icon { font-size: 1rem; width: 20px; text-align: center; }
  .settings-dropdown .menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }


  /* ── Content area ─────────────────────────── */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .tab-panel {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .tab-panel.active {
    display: flex;
  }

  /* ── Split: output | params ──────────────── */
  .split {
    flex: 1;
    display: flex;
    gap: 0;
    overflow: hidden;
    min-height: 0;
  }

  /* Output pane */
  .output-pane {
    flex: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #111122;
    overflow: hidden;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  .output-placeholder {
    text-align: center;
    color: var(--text-secondary);
  }
  .output-placeholder .icon {
    font-size: 3rem;
    margin-bottom: 12px;
    opacity: .4;
  }
  .output-placeholder p {
    font-size: .9rem;
    line-height: 1.6;
  }

  /* Params pane */
  .params-pane {
    flex: 4;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
    gap: 14px;
    min-width: 280px;
    max-width: 420px;
    min-height: 0;
    position: relative;
  }
  .btn-reset {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: .85rem;
    transition: .15s;
    z-index: 1;
  }
  .btn-reset:hover { background: var(--surface-hover); color: var(--text); border-color: var(--border); }

  /* ── Output pane overlay buttons ──────────── */
  .output-overlay-btn {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    background: rgba(0,0,0,.55);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: var(--radius);
    color: rgba(255,255,255,.7);
    cursor: pointer;
    font-size: .9rem;
    transition: .15s;
    z-index: 5;
  }
  .output-overlay-btn:hover {
    background: rgba(0,0,0,.75);
    color: #fff;
    border-color: var(--accent);
  }
  .output-overlay-btn.top-right { top: 12px; right: 12px; }
  .output-overlay-btn.bottom-right { bottom: 12px; right: 12px; }

  /* ── Form elements ─────────────────────────── */
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .field select, .field input[type="text"], .field input[type="number"], .field textarea {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 10px;
    font-size: .85rem;
    font-family: var(--font);
    transition: .15s;
    width: 100%;
  }
  .field select:focus, .field input:focus, .field textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(233,69,96,.15);
  }
  .field-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .field-row .field { flex: 1; }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    background: var(--accent);
    border-radius: 50%;
    cursor: pointer;
  }
  .range-value {
    font-size: .75rem;
    color: var(--accent);
    font-weight: 600;
    text-align: right;
    margin-top: 2px;
  }

  /* ── Stepper (numeric input with +/- buttons) ── */
  .stepper {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg);
    transition: .15s;
  }
  .stepper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(233,69,96,.15);
  }
  .stepper input {
    flex: 1;
    width: 40px;
    min-width: 0;
    border: none;
    background: var(--bg);
    color: var(--text);
    text-align: center;
    font-size: .85rem;
    font-family: var(--font);
    padding: 7px 2px;
    -moz-appearance: textfield;
  }
  .stepper input::-webkit-inner-spin-button,
  .stepper input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper input:focus { outline: none; }
  .stepper-btn {
    flex-shrink: 0;
    width: 28px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: .95rem;
    font-weight: 500;
    cursor: pointer;
    transition: .12s;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font);
    line-height: 1;
  }
  .stepper-btn:hover { background: var(--surface-hover); color: var(--text); }
  .stepper-btn:last-child { border-left: 1px solid var(--border); }
  .stepper-btn:first-child { border-right: 1px solid var(--border); }

  .check-label {
    display: flex !important;
    align-items: center;
    gap: 6px;
    font-size: .78rem !important;
    font-weight: 600 !important;
    color: var(--text) !important;
    text-transform: none !important;
    letter-spacing: 0 !important;
    cursor: pointer;
    white-space: nowrap;
  }
  .check-label input[type="checkbox"] {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    cursor: pointer;
    display: grid;
    place-content: center;
    flex-shrink: 0;
    transition: .15s;
  }
  .check-label input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check-label input[type="checkbox"]:checked::after {
    content: '✓';
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .radio-group {
    display: flex;
    gap: 8px;
  }
  .radio-btn {
    flex: 1;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text-secondary);
    font-size: .8rem;
    cursor: pointer;
    text-align: center;
    transition: .15s;
    font-family: var(--font);
  }
  .radio-btn:hover { border-color: var(--accent); color: var(--text); }
  .radio-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: var(--radius);
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
    font-family: var(--font);
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
  }
  .btn-secondary:hover { background: var(--surface-hover); color: var(--text); }

  /* Right column: action button(s) */
  .btn-col {
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 44px;
  }
  .btn-generate {
    flex: 1;
    width: 44px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    border-radius: var(--radius);
    cursor: pointer;
    transition: .15s;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .btn-generate:hover { background: var(--accent-hover); }
  .btn-generate.btn-restore {
    flex: 1;
    background: var(--bg);
    color: var(--text-secondary);
    border-color: var(--border);
  }
  .btn-generate.btn-restore:hover {
    background: var(--surface-hover);
    color: var(--accent);
    border-color: var(--accent);
  }

  /* Inline copy button next to URL */
  .btn-copy-inline {
    flex-shrink: 0;
    width: 18px; height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: .6rem;
    transition: .15s;
    padding: 0;
  }
  .btn-copy-inline:disabled {
    opacity: .45;
    cursor: default;
  }
  .btn-copy-inline:not(:disabled):hover {
    background: var(--surface-hover);
    color: var(--accent);
    border-color: var(--accent);
  }


  /* ── Bottom prompt bar ─────────────────────── */
  .bottom-bar {
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    background: var(--surface);
    display: flex;
    gap: 12px;
    align-items: stretch;
    flex-shrink: 0;
  }
  .prompt-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .prompt-col textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    padding: 8px 14px;
    font-size: .9rem;
    font-family: var(--font);
    resize: none;
    min-height: 64px;
    line-height: 1.5;
    transition: .15s;
  }
  .prompt-col textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(233,69,96,.15);
  }
  .result-url {
    font-size: .6rem;
    color: var(--text-secondary);
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
  }
  .result-url-row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 12px;
    line-height: 12px;
  }


  /* ── Slider comparison mock ──────────────── */
  .compare-slider {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 3/4;
    overflow: hidden;
    border-radius: var(--radius);
    cursor: ew-resize;
  }
  .compare-slider .side {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  .compare-slider .before {
    clip-path: inset(0 50% 0 0);
    background: linear-gradient(135deg, #2d2d44 0%, #1a1a3e 50%, #0d0d2b 100%);
  }
  .compare-slider .after {
    clip-path: inset(0 0 0 50%);
    background: linear-gradient(135deg, #1a1a3e 0%, #0d0d2b 50%, #2d2d44 100%);
  }
  .compare-slider .label {
    position: absolute;
    top: 12px;
    padding: 4px 12px;
    background: rgba(0,0,0,.65);
    color: #fff;
    font-size: .7rem;
    font-weight: 600;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: .05em;
    pointer-events: none;
  }
  .compare-slider .before .label { left: 12px; }
  .compare-slider .after .label { right: 12px; }
  .compare-slider .divider {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 2px;
    background: rgba(255,255,255,.7);
    mix-blend-mode: difference;
    pointer-events: none;
  }
  .compare-slider .handle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 13px; height: 38px;
    background: rgba(255,255,255,.9);
    border-radius: 3px;
    pointer-events: none;
  }

  /* ── Video player mock ────────────────────── */
  .video-mock {
    width: 100%;
    max-width: 640px;
    aspect-ratio: 3/5;
    background: #000;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .video-mock .play-btn {
    width: 56px; height: 56px;
    background: rgba(233,69,96,.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    color: #fff;
    transition: .15s;
  }
  .video-mock:hover .play-btn { background: var(--accent); transform: scale(1.05); }
  .video-mock .bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 32px;
    background: linear-gradient(transparent, rgba(0,0,0,.7));
    display: flex; align-items: flex-end;
    padding: 6px 12px;
  }
  .video-mock .bar .progress {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,.2);
    border-radius: 2px;
    position: relative;
  }
  .video-mock .bar .progress::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 35%;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ── Toast / status ────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 20px;
    font-size: .85rem;
    color: var(--text);
    box-shadow: var(--shadow);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
  }
  .toast.show { opacity: 1; pointer-events: auto; }

  /* ── Advanced params modal ─────────────────── */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
  }
  .modal-backdrop.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90vw;
    max-width: 480px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,.6);
    transform: translateY(12px);
    transition: transform .2s;
  }
  .modal-backdrop.show .modal-box { transform: translateY(0); }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .modal-header h2 {
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .modal-close {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1.1rem;
    transition: .15s;
  }
  .modal-close:hover { background: var(--surface-hover); color: var(--text); }
  .modal-body {
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-body .field label { font-size: .78rem; }
  .modal-body .field textarea,
  .modal-body .field input[type="text"] {
    font-size: .82rem;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  }
  .modal-body .field textarea {
    min-height: 80px;
    resize: vertical;
  }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 0;
  }
  .toggle-row span {
    font-size: .8rem;
    font-weight: 600;
    color: var(--text);
  }
  .toggle-switch {
    position: relative;
    width: 40px; height: 22px;
    background: var(--border);
    border-radius: 11px;
    cursor: pointer;
    transition: background .2s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--accent); }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
  }
  .toggle-switch.on::after { transform: translateX(18px); }
  .modal-footer {
    padding: 12px 20px 18px;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-footer .btn { width: auto; }

  /* ── Responsive ────────────────────────────── */
  @media (max-width: 1023px) {
    /* Portrait: stacked layout fills viewport, params scroll if needed */

    /* Icons only — hide text labels to save horizontal space */
    .tab-btn { padding: 10px 10px; }
    .tab-label { display: none; }
    .tab-icon { margin-right: 0; font-size: 1rem; }
    .btn-col { width: 40px; }
    .btn-generate { font-size: 1rem; }

    /* Stack: output on top, params fill remaining, prompt at bottom */
    .split {
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .output-pane {
      flex: 0 0 auto;
      min-height: 0;
      max-height: 50vh;
    }
    .params-pane {
      flex: 1 1 auto;
      min-height: 0;
      max-width: none;
      border-left: none;
      border-top: 1px solid var(--border);
      overflow-y: auto;
    }
    .tabs-params-zone { max-width: none; }
  }
  @media (max-width: 767px) {
    .tabs-output-zone { padding-left: 4px; }
    .tabs-inner { padding-left: 8px; }
    .tab-gear { width: 28px; height: 28px; }
    .tabs-title { font-size: .78rem; padding: 4px 8px; }
    .output-pane { padding: 16px; }
    .params-pane { padding: 14px; gap: 10px; }
    .bottom-bar { padding: 8px 14px; }
    .modal-box { width: 95vw; max-height: 90vh; border-radius: 10px; }
  }
</style>
</head>
<body>

<!-- Main -->
<div class="main">

  <!-- Tabs + title bar -->
  <nav class="tabs" id="tabNav">
    <div class="tabs-output-zone">
      <div class="tabs-inner">
        <button class="tab-btn active" data-tab="generate" onclick="switchTab('generate')">
          <span class="tab-icon">🖼️</span><span class="tab-label">Generate</span>
        </button>
        <button class="tab-btn" data-tab="edit" onclick="switchTab('edit')">
          <span class="tab-icon">✏️</span><span class="tab-label">Edit</span>
        </button>
        <button class="tab-btn" data-tab="upscale" onclick="switchTab('upscale')">
          <span class="tab-icon">🔍</span><span class="tab-label">Upscale</span>
        </button>
        <button class="tab-btn" data-tab="video" onclick="switchTab('video')">
          <span class="tab-icon">🎬</span><span class="tab-label">Video</span>
        </button>
        <button class="tab-gear" onclick="openAdvancedModal()" title="Advanced parameters for current tab">⚙️</button>
      </div>
    </div>
    <div class="tabs-params-zone">
      <button class="tabs-title" onclick="toggleSettingsMenu(event)">
        🎨 Comfy Tools
        <span class="tabs-arrow">▾</span>
      </button>
    </div>
  </nav>

  <!-- Settings dropdown menu -->
  <div class="settings-dropdown" id="settingsMenu">
    <div class="menu-section">Appearance</div>
    <button class="menu-item" onclick="toggleTheme(); hideSettingsMenu();">
      <span class="item-icon">🌓</span> Toggle light / dark theme
    </button>
    <div class="menu-sep"></div>
    <div class="menu-section">ComfyUI Connection</div>
    <button class="menu-item" onclick="showToast('Configure ComfyUI server (WIP)'); hideSettingsMenu();">
      <span class="item-icon">🔌</span> Server URL
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-secondary)">localhost:8188</span>
    </button>
    <button class="menu-item" onclick="showToast('Configure image base URL (WIP)'); hideSettingsMenu();">
      <span class="item-icon">🖼️</span> Image base URL
      <span style="margin-left:auto;font-size:.7rem;color:var(--text-secondary)">default</span>
    </button>
  </div>

  <!-- Content -->
  <div class="content" id="tabContent">

    <!-- ═══ TAB 1: Generate Image ═══ -->
    <div class="tab-panel active" id="tab-generate">
      <div class="split">
        <div class="output-pane">
          <div class="output-placeholder">
            <div class="icon">🖼️</div>
            <p>Your generated image<br>will appear here</p>
            <p style="font-size:.75rem;margin-top:6px;">Click to open lightbox</p>
          </div>
        </div>
        <div class="params-pane">
          <div class="field">
            <label>Model Family</label>
            <select id="genModelFamily" onchange="onModelFamilyChange()">
              <option data-steps="10" data-vae="16">Z-Image Turbo</option>
              <option data-steps="8" data-vae="8">Krea 2</option>
              <option data-steps="8" data-vae="64">FLUX.2 Klein</option>
            </select>
          </div>
          <div class="field-row" id="genCustomRatio" style="display:none">
            <div class="field">
              <label>Custom W</label>
              <input type="number" value="16" min="1" class="gen-dim" oninput="recalcResolution()">
            </div>
            <div class="field">
              <label>Custom H</label>
              <input type="number" value="9" min="1" class="gen-dim" oninput="recalcResolution()">
            </div>
          </div>
          <!-- Row 1: Width | Height | AR | MP -->
          <div class="field-row">
            <div class="field">
              <label>Width</label>
              <input type="number" id="genWidth" value="832" disabled style="opacity:.5">
            </div>
            <div class="field">
              <label>Height</label>
              <input type="number" id="genHeight" value="1248" disabled style="opacity:.5">
            </div>
            <div class="field">
              <label style="visibility:hidden">W/H</label>
              <select id="genAspectRatio" onchange="onModelFamilyChange()">
                <option data-w="2" data-h="3">2:3</option>
                <option data-w="1" data-h="1">1:1</option>
                <option data-w="3" data-h="2">3:2</option>
                <option data-w="3" data-h="4">3:4</option>
                <option data-w="4" data-h="3">4:3</option>
                <option data-w="9" data-h="16">9:16</option>
                <option data-w="16" data-h="9">16:9</option>
                <option data-w="0" data-h="0">Custom</option>
              </select>
            </div>
            <div class="field">
              <label style="visibility:hidden">MP</label>
              <div class="stepper">
                <button class="stepper-btn" onclick="stepMp(-0.1)" title="Decrease">−</button>
                <input type="number" id="genMegapixel" value="1" min="0.1" max="2" step="0.1" oninput="onModelFamilyChange()">
                <button class="stepper-btn" onclick="stepMp(0.1)" title="Increase">+</button>
              </div>
            </div>
          </div>
          <!-- Row 2: Steps | Seed + Random check -->
          <div class="field-row">
            <div class="field">
              <label>Steps</label>
              <div class="stepper">
                <button class="stepper-btn" onclick="stepSteps(-1)" title="Decrease">−</button>
                <input type="number" id="genSteps" value="10" min="1" max="15" step="1" oninput="onStepsInput()">
                <button class="stepper-btn" onclick="stepSteps(1)" title="Increase">+</button>
              </div>
            </div>
            <div class="field">
              <label>Seed</label>
              <input type="number" id="genSeed" value="0" min="0" oninput="onSeedInput()">
            </div>
            <div class="field" style="justify-content:flex-end">
              <label style="visibility:hidden">Random</label>
              <label class="check-label" style="margin-top:4px">
                <input type="checkbox" id="genSeedRandom" checked onchange="onSeedRandomToggle()">
                Random
              </label>
            </div>
          </div>
          <div class="field">
            <label>LoRAs</label>
            <button class="btn btn-secondary" style="font-size:.8rem;padding:6px" onclick="showToast('Add LoRA (WIP)')">+ Add LoRA</button>
          </div>
          <button class="btn-reset" onclick="showToast('Parameters reset')" title="Reset">↺</button>
        </div>
      </div>
    </div>

    <!-- ═══ TAB 2: Edit Image ═══ -->
    <div class="tab-panel" id="tab-edit">
      <div class="split">
        <div class="output-pane">
          <button class="output-overlay-btn top-right" onclick="showToast('File picker (WIP)')" title="Upload image">📁</button>
          <button class="output-overlay-btn bottom-right" onclick="showToast('Use previous generation (WIP)')" title="Use previous generation">🔗</button>
          <div class="compare-slider">
            <div class="side before">
              <span class="label">Original</span>
            </div>
            <div class="side after">
              <span class="label">Edited</span>
            </div>
            <div class="divider"></div>
            <div class="handle"></div>
          </div>
        </div>
        <div class="params-pane">
          <!-- Row: Steps | Seed + Random check -->
          <div class="field-row">
            <div class="field">
              <label>Steps</label>
              <div class="stepper">
                <button class="stepper-btn" onclick="stepEditSteps(-1)" title="Decrease">−</button>
                <input type="number" id="editSteps" value="6" min="1" max="15" step="1" oninput="onEditStepsInput()">
                <button class="stepper-btn" onclick="stepEditSteps(1)" title="Increase">+</button>
              </div>
            </div>
            <div class="field">
              <label>Seed</label>
              <input type="number" id="editSeed" value="0" min="0" oninput="onEditSeedInput()">
            </div>
            <div class="field" style="justify-content:flex-end">
              <label style="visibility:hidden">Random</label>
              <label class="check-label" style="margin-top:4px">
                <input type="checkbox" id="editSeedRandom" checked onchange="onEditSeedRandomToggle()">
                Random
              </label>
            </div>
          </div>
          <button class="btn-reset" onclick="showToast('Parameters reset')" title="Reset">↺</button>
        </div>
      </div>
    </div>

    <!-- ═══ TAB 3: Upscale ═══ -->
    <div class="tab-panel" id="tab-upscale">
      <div class="split">
        <div class="output-pane">
          <button class="output-overlay-btn top-right" onclick="showToast('File picker (WIP)')" title="Upload image">📁</button>
          <button class="output-overlay-btn bottom-right" onclick="showToast('Use previous generation (WIP)')" title="Use previous generation">🔗</button>
          <div class="compare-slider">
            <div class="side before">
              <span class="label">Original</span>
            </div>
            <div class="side after" style="background:linear-gradient(135deg,#1a1a3e 0%,#0d0d2b 50%,#2d2d44 100%);">
              <span class="label">Upscaled</span>
            </div>
            <div class="divider"></div>
            <div class="handle"></div>
          </div>
        </div>
        <div class="params-pane">
          <div class="field">
            <label>Target Resolution <span style="font-weight:400">(2048px)</span></label>
            <input type="range" min="1024" max="4096" step="256" value="2048" oninput="this.nextElementSibling.textContent=this.value+'px'">
            <span class="range-value">2048px</span>
          </div>
          <div class="field">
            <label>Blend Factor <span style="font-weight:400">(0.15)</span></label>
            <input type="range" min="0" max="1" step="0.05" value="0.15" oninput="this.nextElementSibling.textContent=this.value">
            <span class="range-value">0.15</span>
          </div>
          <div class="field">
            <label>Color Correction</label>
            <select>
              <option>lab</option>
              <option>rgb</option>
              <option>none</option>
            </select>
          </div>
          <div class="field">
            <label>Seed</label>
            <input type="number" id="upscaleSeed" value="0" min="0" oninput="onUpscaleSeedInput()">
          </div>
          <div class="field" style="flex-direction:row;align-items:center;justify-content:flex-end">
            <label class="check-label">
              <input type="checkbox" id="upscaleSeedRandom" checked onchange="onUpscaleSeedRandomToggle()">
              Random
            </label>
          </div>
          <button class="btn-reset" onclick="showToast('Parameters reset')" title="Reset">↺</button>
        </div>
      </div>
    </div>

    <!-- ═══ TAB 4: Generate Video ═══ -->
    <div class="tab-panel" id="tab-video">
      <div class="split">
        <div class="output-pane">
          <button class="output-overlay-btn top-right" onclick="showToast('File picker (WIP)')" title="Upload image">📁</button>
          <button class="output-overlay-btn bottom-right" onclick="showToast('Use previous generation (WIP)')" title="Use previous generation">🔗</button>
          <div class="video-mock" onclick="showToast('Video player (WIP)')">
            <div class="play-btn">▶</div>
            <div class="bar"><div class="progress"></div></div>
          </div>
        </div>
        <div class="params-pane">
          <div class="field">
            <label>Model Version</label>
            <select>
              <option>Wan 2.1</option>
              <option>Wan 2.2</option>
            </select>
          </div>
          <!-- Row: Frames | Steps | Seed + Random check -->
          <div class="field-row">
            <div class="field">
              <label>Frames</label>
              <div class="stepper">
                <button class="stepper-btn" onclick="stepVideoFrames(-4)" title="Decrease">−</button>
                <input type="number" id="videoFrames" value="81" min="81" max="161" step="4" oninput="onVideoFramesInput()">
                <button class="stepper-btn" onclick="stepVideoFrames(4)" title="Increase">+</button>
              </div>
            </div>
            <div class="field">
              <label>Steps</label>
              <div class="stepper">
                <button class="stepper-btn" onclick="stepVideoSteps(-1)" title="Decrease">−</button>
                <input type="number" id="videoSteps" value="4" min="4" max="10" step="1" oninput="onVideoStepsInput()">
                <button class="stepper-btn" onclick="stepVideoSteps(1)" title="Increase">+</button>
              </div>
            </div>
            <div class="field">
              <label>Seed</label>
              <input type="number" id="videoSeed" value="0" min="0" oninput="onVideoSeedInput()">
            </div>
            <div class="field" style="justify-content:flex-end">
              <label style="visibility:hidden">Random</label>
              <label class="check-label" style="margin-top:4px">
                <input type="checkbox" id="videoSeedRandom" checked onchange="onVideoSeedRandomToggle()">
                Random
              </label>
            </div>
          </div>
          <div class="field">
            <label>Negative Prompt</label>
            <textarea rows="2" placeholder="Optional — overrides default"></textarea>
          </div>
          <button class="btn-reset" onclick="showToast('Parameters reset')" title="Reset">↺</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom prompt bar -->
  <div class="bottom-bar" id="bottomBar">
    <div class="prompt-col">
      <textarea id="promptInput"
        placeholder="Describe the image you want to generate in detail..."></textarea>
      <div class="result-url-row" id="resultUrlRow">
        <span class="result-url" id="resultUrl"></span>
        <button class="btn-copy-inline" id="btnCopyUrl" onclick="copyResultUrl()" title="Copy URL" disabled>📋</button>
      </div>
    </div>
    <div class="btn-col" id="btnCol">
      <button class="btn-generate" id="btnGenerate" onclick="generateImage()" title="Generate">✨</button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Advanced params modal -->
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <h2 id="modalTitle">⚙️ Advanced Parameters</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <!-- Filled dynamically by openModal() -->
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveAdvanced()">Save</button>
    </div>
  </div>
</div>

<script>
  // ── Global state ──────────────────────────
  let baseUrl = 'http://localhost:8188';
  let lastGeneratedUrl = null;

  function setResultUrl(filename) {
    lastGeneratedUrl = `${baseUrl}/view?filename=${encodeURIComponent(filename)}&type=output`;
    document.getElementById('resultUrl').textContent = lastGeneratedUrl;
    document.getElementById('btnCopyUrl').disabled = false;
  }

  function copyResultUrl() {
    navigator.clipboard.writeText(lastGeneratedUrl).then(() => {
      showToast('URL copied');
    }).catch(() => showToast('Copy failed'));
  }

  function generateImage() {
    showToast('Workflow submitted to ComfyUI');
    const ts = Date.now();
    setResultUrl(`ComfyUI_${ts.toString(36)}_.png`);
  }
  function generateEdit() {
    showToast('Edit submitted to ComfyUI');
    const ts = Date.now();
    setResultUrl(`ComfyUI_edit_${ts.toString(36)}_.png`);
  }
  function generateUpscale() {
    showToast('Upscale submitted to ComfyUI');
    const ts = Date.now();
    setResultUrl(`ComfyUI_upscale_${ts.toString(36)}_.png`);
  }
  function generateVideo() {
    showToast('Video submitted to ComfyUI');
    const ts = Date.now();
    setResultUrl(`ComfyUI_video_${ts.toString(36)}_.mp4`);
  }

  // Tab switching
  let currentTab = 'generate';

  // ── Settings dropdown ─────────────────────
  let settingsOpen = false;
  function toggleSettingsMenu(e) {
    e.stopPropagation();
    settingsOpen = !settingsOpen;
    const btn = document.querySelector('.tabs-title');
    const menu = document.getElementById('settingsMenu');
    btn.classList.toggle('open', settingsOpen);
    menu.classList.toggle('show', settingsOpen);
  }
  function hideSettingsMenu() {
    settingsOpen = false;
    document.querySelector('.tabs-title').classList.remove('open');
    document.getElementById('settingsMenu').classList.remove('show');
  }
  document.addEventListener('click', (e) => {
    if (settingsOpen && !e.target.closest('.tabs-params-zone')) hideSettingsMenu();
  });

  function toggleTheme() {
    const root = document.documentElement;
    const isDark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#1a1a2e';
    if (isDark) {
      root.style.setProperty('--bg', '#f0f0f5');
      root.style.setProperty('--surface', '#ffffff');
      root.style.setProperty('--surface-hover', '#f5f5fa');
      root.style.setProperty('--text', '#1a1a2e');
      root.style.setProperty('--text-secondary', '#6a6a7a');
      root.style.setProperty('--border', '#d0d0dd');
      document.querySelector('.output-pane').style.background = '#eaeaef';
    } else {
      root.style.setProperty('--bg', '#1a1a2e');
      root.style.setProperty('--surface', '#16213e');
      root.style.setProperty('--surface-hover', '#1c2a4a');
      root.style.setProperty('--text', '#eaeaea');
      root.style.setProperty('--text-secondary', '#a0a0b0');
      root.style.setProperty('--border', '#2a2a4a');
      document.querySelector('.output-pane').style.background = '#111122';
    }
  }

  function switchTab(name) {
    currentTab = name;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelector(`[data-tab="${name}"]`).classList.add('active');
    document.getElementById(`tab-${name}`).classList.add('active');

    // Update prompt bar
    const bar = document.getElementById('bottomBar');
    const input = document.getElementById('promptInput');
    const btnCol = document.getElementById('btnCol');

    // Reset copy URL state when switching tools
    lastGeneratedUrl = null;
    document.getElementById('resultUrl').textContent = '';
    document.getElementById('btnCopyUrl').disabled = true;

    switch(name) {
      case 'generate':
        bar.style.display = 'flex';
        input.style.display = 'block';
        input.placeholder = 'Describe the image you want to generate in detail...';
        btnCol.innerHTML = '<button class="btn-generate" onclick="generateImage()" title="Generate">✨</button>';
        break;
      case 'edit':
        bar.style.display = 'flex';
        input.style.display = 'block';
        input.placeholder = 'Describe the edit you want to apply (e.g., "change the background to a beach at sunset")...';
        btnCol.innerHTML = '<button class="btn-generate" onclick="generateEdit()" title="Edit">🖌️</button><button class="btn-generate btn-restore" onclick="generateEdit()" title="Restore (same as edit but with restoration prompt)">🩹</button>';
        break;
      case 'upscale':
        bar.style.display = 'flex';
        input.style.display = 'none';
        btnCol.innerHTML = '<button class="btn-generate" onclick="generateUpscale()" title="Upscale">🔍</button>';
        break;
      case 'video':
        bar.style.display = 'flex';
        input.style.display = 'block';
        input.placeholder = 'Describe the motion and action (e.g., "a cat walking slowly through a field of flowers, gentle breeze")...';
        btnCol.innerHTML = '<button class="btn-generate" onclick="generateVideo()" title="Video">🎬</button>';
        break;
    }
  }

  // Radio group toggle
  function selectRadio(btn) {
    btn.parentElement.querySelectorAll('.radio-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // ── Stepper helpers ───────────────────────
  function stepMp(delta) {
    const input = document.getElementById('genMegapixel');
    const val = parseFloat(input.value) + delta;
    const clamped = Math.round(Math.min(2, Math.max(0.1, val)) * 10) / 10;
    input.value = clamped;
    onModelFamilyChange();
  }
  function stepSteps(delta) {
    const input = document.getElementById('genSteps');
    const val = parseInt(input.value) + delta;
    const clamped = Math.min(15, Math.max(1, val));
    input.value = clamped;
  }
  function onStepsInput() {
    const input = document.getElementById('genSteps');
    const v = parseInt(input.value);
    if (isNaN(v) || v < 1) input.value = 1;
    if (v > 15) input.value = 15;
  }

  // ── Seed + random toggle ──────────────────
  function onSeedRandomToggle() {
    const checked = document.getElementById('genSeedRandom').checked;
    const seedInput = document.getElementById('genSeed');
    seedInput.disabled = checked;
    if (checked) seedInput.value = '';
  }
  function onSeedInput() {
    const input = document.getElementById('genSeed');
    if (input.value !== '') {
      document.getElementById('genSeedRandom').checked = false;
      input.disabled = false;
    }
  }

  // ── Edit tab helpers ─────────────────────
  function stepEditSteps(d) { const input = document.getElementById('editSteps'); const val = Math.min(15, Math.max(1, parseInt(input.value) + d)); input.value = val; }
  function onEditStepsInput() { const input = document.getElementById('editSteps'); const v = parseInt(input.value); if (isNaN(v)||v<1) input.value=1; if (v>15) input.value=15; }
  function onEditSeedRandomToggle() { const s=document.getElementById('editSeedRandom').checked; const inp=document.getElementById('editSeed'); inp.disabled=s; if(s) inp.value=''; }
  function onEditSeedInput() { const inp=document.getElementById('editSeed'); if(inp.value!==''){ document.getElementById('editSeedRandom').checked=false; inp.disabled=false; } }

  // ── Upscale tab helpers ──────────────────
  function onUpscaleSeedRandomToggle() { const s=document.getElementById('upscaleSeedRandom').checked; const inp=document.getElementById('upscaleSeed'); inp.disabled=s; if(s) inp.value=''; }
  function onUpscaleSeedInput() { const inp=document.getElementById('upscaleSeed'); if(inp.value!==''){ document.getElementById('upscaleSeedRandom').checked=false; inp.disabled=false; } }

  // ── Video tab helpers ────────────────────
  function stepVideoFrames(d) { const input=document.getElementById('videoFrames'); let val=parseInt(input.value)+d; val=Math.round(val/4)*4+1; input.value=Math.min(161,Math.max(81,val)); }
  function onVideoFramesInput() { const input=document.getElementById('videoFrames'); const v=parseInt(input.value); let r=Math.round(v/4)*4+1; r=Math.max(81,Math.min(161,r)); input.value=r; }
  function stepVideoSteps(d) { const input=document.getElementById('videoSteps'); const val=Math.min(10,Math.max(4,parseInt(input.value)+d)); input.value=val; }
  function onVideoStepsInput() { const input=document.getElementById('videoSteps'); const v=parseInt(input.value); if(isNaN(v)||v<4) input.value=4; if(v>10) input.value=10; }
  function onVideoSeedRandomToggle() { const s=document.getElementById('videoSeedRandom').checked; const inp=document.getElementById('videoSeed'); inp.disabled=s; if(s) inp.value=''; }
  function onVideoSeedInput() { const inp=document.getElementById('videoSeed'); if(inp.value!==''){ document.getElementById('videoSeedRandom').checked=false; inp.disabled=false; } }

  // Auto-set steps when model family changes (Generate Image tab)
  function onModelFamilyChange() {
    const sel = document.getElementById('genModelFamily');
    const opt = sel.options[sel.selectedIndex];

    // Update steps input
    const steps = parseInt(opt.getAttribute('data-steps')) || 8;
    document.getElementById('genSteps').value = steps;

    // Show/hide custom ratio fields
    const arSel = document.getElementById('genAspectRatio');
    const arOpt = arSel.options[arSel.selectedIndex];
    const customRow = document.getElementById('genCustomRatio');
    if (arOpt.getAttribute('data-w') === '0') {
      customRow.style.display = 'flex';
    } else {
      customRow.style.display = 'none';
    }

    // Update megapixel input
    const mpInput = document.getElementById('genMegapixel');
    const mp = parseFloat(mpInput.value);
    if (isNaN(mp) || mp < 0.1) mpInput.value = 0.1;
    if (mp > 2) mpInput.value = 2;

    recalcResolution();
  }

  function recalcResolution() {
    const sel = document.getElementById('genModelFamily');
    const opt = sel.options[sel.selectedIndex];
    const vaeScale = parseInt(opt.getAttribute('data-vae')) || 16;

    const arSel = document.getElementById('genAspectRatio');
    const arOpt = arSel.options[arSel.selectedIndex];

    let wRatio, hRatio;
    if (arOpt.getAttribute('data-w') === '0') {
      // Custom ratio — read from the custom inputs
      const customInputs = document.querySelectorAll('#genCustomRatio input');
      wRatio = parseInt(customInputs[0]?.value) || 16;
      hRatio = parseInt(customInputs[1]?.value) || 9;
    } else {
      wRatio = parseInt(arOpt.getAttribute('data-w'));
      hRatio = parseInt(arOpt.getAttribute('data-h'));
    }

    const mp = parseFloat(document.getElementById('genMegapixel').value);
    const totalPixels = mp * 1_000_000;

    // w = sqrt(totalPixels * wRatio / hRatio)
    const rawW = Math.sqrt(totalPixels * wRatio / hRatio);
    const rawH = rawW * hRatio / wRatio;

    // Round to nearest multiple of vae_scale_factor
    const w = Math.max(vaeScale, Math.round(rawW / vaeScale) * vaeScale);
    const h = Math.max(vaeScale, Math.round(rawH / vaeScale) * vaeScale);

    document.getElementById('genWidth').value = w;
    document.getElementById('genHeight').value = h;
  }

  // Initial calculation on page load
  window.addEventListener('DOMContentLoaded', () => {
    recalcResolution();
  });

  // Toast notification
  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // Compare slider drag simulation
  document.querySelectorAll('.compare-slider').forEach(slider => {
    let dragging = false;

    function update(e) {
      const rect = slider.getBoundingClientRect();
      let pct = (e.clientX - rect.left) / rect.width;
      pct = Math.max(0.05, Math.min(0.95, pct));
      const pctStr = (pct * 100) + '%';
      const invPct = ((1 - pct) * 100) + '%';
      slider.querySelector('.before').style.clipPath = `inset(0 ${invPct} 0 0)`;
      slider.querySelector('.after').style.clipPath = `inset(0 0 0 ${pctStr})`;
      slider.querySelector('.divider').style.left = pctStr;
      slider.querySelector('.handle').style.left = pctStr;
    }

    slider.addEventListener('pointerdown', e => {
      dragging = true;
      slider.setPointerCapture(e.pointerId);
      update(e);
    });
    slider.addEventListener('pointermove', e => {
      if (dragging) update(e);
    });
    slider.addEventListener('pointerup', () => { dragging = false; });
  });

  // Keyboard shortcut: Ctrl+1..4 to switch tabs
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey) {
      const map = { '1': 'generate', '2': 'edit', '3': 'upscale', '4': 'video' };
      if (map[e.key]) { e.preventDefault(); switchTab(map[e.key]); }
    }
    // Escape closes modal
    if (e.key === 'Escape') closeModal();
  });

  // ── Advanced params modal ──────────────────
  function openAdvancedModal() {
    openModal(currentTab);
  }

  let currentModalTab = null;

  const modalConfigs = {
    generate: {
      title: 'Generate Image',
      fields: [
        { label: 'Model name', type: 'text', placeholder: 'Default from model family (e.g. zImageTurbo-mxfp8.safetensors)' },
        { label: 'LoRA config (JSON)', type: 'textarea', placeholder: '[{"name":"my-lora.safetensors","strength":1.0}]' },
        { label: 'Override system LoRAs', type: 'toggle' },
        { label: 'Image base URL', type: 'text', placeholder: 'Leave empty for default' },
      ]
    },
    edit: {
      title: 'Edit Image',
      fields: [
        { label: 'LoRA config (JSON)', type: 'textarea', placeholder: '[{"name":"my-lora.safetensors","strength":1.0}]' },
        { label: 'Override system LoRAs', type: 'toggle' },
        { label: 'Image base URL', type: 'text', placeholder: 'Leave empty for default' },
      ]
    },
    upscale: {
      title: 'Upscale',
      fields: [
        { label: 'Image base URL', type: 'text', placeholder: 'Leave empty for default' },
      ]
    },
    video: {
      title: 'Generate Video',
      fields: [
        { label: 'Diffusion model (JSON)', type: 'textarea', placeholder: 'Override model file(s). Object for Wan 2.1, array for Wan 2.2' },
        { label: 'LoRA config (JSON)', type: 'textarea', placeholder: '[{"name":"my-lora.safetensors","strength":1.0,"path":"high"}]' },
        { label: 'Video base URL', type: 'text', placeholder: 'Leave empty for default' },
      ]
    }
  };

  function openModal(tab) {
    currentModalTab = tab;
    const cfg = modalConfigs[tab];
    const backdrop = document.getElementById('modalBackdrop');

    document.getElementById('modalTitle').innerHTML = `⚙️ Advanced — ${cfg.title}`;

    let html = '';
    cfg.fields.forEach(f => {
      if (f.type === 'toggle') {
        html += `<div class="toggle-row"><span>${f.label}</span><div class="toggle-switch" onclick="this.classList.toggle('on')"></div></div>`;
      } else if (f.type === 'textarea') {
        html += `<div class="field"><label>${f.label}</label><textarea placeholder="${f.placeholder||''}"></textarea></div>`;
      } else {
        html += `<div class="field"><label>${f.label}</label><input type="text" placeholder="${f.placeholder||''}"></div>`;
      }
    });

    document.getElementById('modalBody').innerHTML = html;
    backdrop.classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('show');
    currentModalTab = null;
  }

  function saveAdvanced() {
    // Collect values (WIP — would store in session state in real app)
    const fields = document.querySelectorAll('#modalBody .field input, #modalBody .field textarea');
    const toggles = document.querySelectorAll('#modalBody .toggle-switch');
    const values = {};
    fields.forEach(f => { values[f.previousElementSibling?.textContent || 'field'] = f.value; });
    toggles.forEach(t => { values[t.previousElementSibling?.textContent || 'toggle'] = t.classList.contains('on'); });
    console.log('Advanced params saved for', currentModalTab, values);
    showToast('Advanced parameters saved');
    closeModal();
  }
</script>
